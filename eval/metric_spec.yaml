# Metric spec — "thế nào là tốt", đo bằng gì. Điền ở guide bước 2.4.
# Ôn lại: ngày 5, ngày 9 · lab ngày 5, lab ngày 9.
# CHỐT TRƯỚC 19:30 Thứ Sáu 27/11 (CP2), KHÔNG SỬA SAU. Sửa sau CP2 → khối R4 0 điểm (03-rubric).
#
# ≥3 metric. Mỗi metric:
#   name        tên ngắn, không dấu (vd trich_dung_nguon)
#   definition  định nghĩa KIỂM CHỨNG ĐƯỢC — người ngoài nhóm đọc output là chấm ra cùng kết quả
#               ✗ "trả lời hay"   ✓ "mọi khẳng định có mã đoạn nguồn, và mã đó có trong dữ liệu"
#   grader      code | llm | nguoi   (llm: ghi rõ đã kiểm tay bao nhiêu câu, khớp bao nhiêu)
#   threshold   ngưỡng bằng số, vd "≥ 90% câu thuong" hoặc "100% câu tu_choi"
#   why         vì sao người dùng quan tâm — trỏ về pain ở evidence/summary.md (từ pain, không từ AI)
# Kiểm: python run.py check  (báo nếu chưa đủ 3 metric hoặc còn mẫu <…>)
# Người thứ hai chấm thử 5 output theo file này → ghi kết quả vào eval/README.md mục 3.

metrics:
  - name: "trich_dung_nguon"
    definition: "Trong các câu có yêu cầu dẫn nguồn, đạt khi nội dung và URL khớp thông báo trong đúng thread và ngữ cảnh bài lab. Nếu hai nguồn mâu thuẫn, phải nêu cả hai mốc và link mà không tự chọn một mốc. Dùng expected và pass_criterion để xác định tập câu và chấm."
    grader: "nguoi"
    threshold: "≥90% câu có yêu cầu dẫn nguồn"
    why: "Hạn nộp hoặc hướng dẫn sai khiến học viên nộp muộn hoặc làm sai yêu cầu."
  - name: "dinh_tuyen_dung"
    definition: "Trong các câu cần hỏi lại hoặc tìm người hỗ trợ, đạt khi hỏi đúng dữ kiện còn thiếu, hoặc gợi ý coach khớp lớp/phòng/ngày/ca kèm bước xác nhận mô phỏng, hoặc giữ câu hỏi trong thread nếu chưa xác minh được coach, theo expected và pass_criterion."
    grader: "nguoi"
    threshold: "≥90% câu cần hỏi lại hoặc tìm người hỗ trợ"
    why: "Hỏi đúng phần còn thiếu và gợi ý đúng người giúp học viên quay lại làm bài sớm hơn."
  - name: "thoi_gian_buoc_huu_ich"
    definition: "Trong các câu thuong và kho, đạt khi pass = 1, error trống và latency_s ≤15 trong kết quả eval. Câu lỗi hoặc trượt vẫn tính vào mẫu số."
    grader: "code"
    threshold: "≥90% câu thuong và kho đạt trong ≤15 giây"
    why: "Học viên đang làm lab cần một bước tiếp theo đúng và kịp thời."
