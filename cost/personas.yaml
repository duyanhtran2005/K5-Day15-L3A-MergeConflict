# Mô phỏng chi phí khi dùng thật.
# Giá model là published list price; quy mô và persona bên dưới là self-estimated,
# vì evidence/survey/results.csv không có trường đo tần suất sử dụng mỗi tháng.
# Chạy: python3 run.py simulate --rate-from eval/run-2.csv

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số học viên có khả năng dùng sản phẩm trong một tháng
  low: 10
  base: 20
  high: 30
  source: "self-estimated: ba kịch bản quanh quy mô 20 học viên trong spec.md §2; chưa có số người dùng thật để suy rộng."

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: dung_it
    share: 0.5              # self-estimated: tỷ lệ người dùng kiểu này
    uses_per_month: 1       # spec.md §2: self-estimated
    turns_per_session: 1    # self-estimated: một việc hỏi/phiên
    source: "self-estimated: spec.md §2 đặt persona dùng ít là 1 phiên/người/tháng; share và số lượt/phiên chưa được khảo sát."
  - name: dung_vua
    share: 0.3
    uses_per_month: 2
    turns_per_session: 2
    source: "self-estimated: spec.md §2 đặt persona dùng vừa là 2 phiên/người/tháng; share và số lượt/phiên chưa được khảo sát."
  - name: dung_nhieu
    share: 0.2
    uses_per_month: 4
    turns_per_session: 3
    source: "self-estimated: spec.md §2 đặt persona dùng nhiều là 4 phiên/người/tháng; share và số lượt/phiên chưa được khảo sát."
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # published list price, USD / 1M text tokens; không có cache hay batch discount
  - model: gpt-4o-mini
    input: 0.15
    output: 0.60
    source: "published price: https://openrouter.ai/openai/gpt-4o-mini · accessed 2026-11-28 · USD/1M text tokens"
  - model: gpt-4.1-mini
    input: 0.40
    output: 1.60
    source: "published price: https://openrouter.ai/openai/gpt-4.1-mini · accessed 2026-11-28 · USD/1M text tokens"
